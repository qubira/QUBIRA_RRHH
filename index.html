<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qubira RRHH | Panel de Administración</title>
<link rel="icon" href="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" type="image/png">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<!-- Sprite de íconos (Feather Icons, MIT License) -->
<svg style="display:none">
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></symbol>
  <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></symbol>
  <symbol id="icon-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></symbol>
  <symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></symbol>
  <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></symbol>
  <symbol id="icon-building" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1"></rect><line x1="9" y1="7" x2="9" y2="7"></line><line x1="15" y1="7" x2="15" y2="7"></line><line x1="9" y1="11" x2="9" y2="11"></line><line x1="15" y1="11" x2="15" y2="11"></line><line x1="9" y1="15" x2="9" y2="15"></line><line x1="15" y1="15" x2="15" y2="15"></line><line x1="9" y1="19" x2="15" y2="19"></line></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol>
  <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></symbol>
  <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"></path></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></symbol>
  <symbol id="icon-log-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></symbol>
  <symbol id="icon-alert-triangle" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></symbol>
  <symbol id="icon-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></symbol>
  <symbol id="icon-briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></symbol>
  <symbol id="icon-user-check" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></symbol>
  <symbol id="icon-dollar-sign" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></symbol>
  <symbol id="icon-award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></symbol>
  <symbol id="icon-trending-up" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></symbol>
  <symbol id="icon-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></symbol>
  <symbol id="icon-message-circle" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></symbol>
  <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></symbol>
</svg>

<div class="app-shell">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="logo-mark"><img src="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" alt="Qubira"></div>
      <div>
        Qubira RRHH
        <small>Panel de administración</small>
      </div>
    </div>

    <nav>
      <div class="nav-section-label">General</div>
      <button class="nav-item" data-view="dashboard"><svg class="icon"><use href="#icon-grid"></use></svg> Dashboard</button>
      <button class="nav-item" data-view="calendario"><svg class="icon"><use href="#icon-calendar"></use></svg> Calendario</button>

      <div class="nav-section-label">Gestión de Personal</div>
      <button class="nav-item" data-view="employees"><svg class="icon"><use href="#icon-users"></use></svg> Empleados</button>
      <button class="nav-item" data-view="contracts">
        <svg class="icon"><use href="#icon-file-text"></use></svg> Contratos
        <span class="badge-count" id="badge-contracts" style="display:none;"></span>
      </button>
      <button class="nav-item" data-view="documents"><svg class="icon"><use href="#icon-folder"></use></svg> Documentos</button>
      <button class="nav-item" data-view="departments"><svg class="icon"><use href="#icon-building"></use></svg> Departamentos</button>

      <div class="nav-section-label">Reclutamiento y Selección</div>
      <button class="nav-item" data-view="recruitment"><svg class="icon"><use href="#icon-briefcase"></use></svg> Reclutamiento</button>

      <div class="nav-section-label">Administración y Nómina</div>
      <button class="nav-item" data-view="payroll">
        <svg class="icon"><use href="#icon-dollar-sign"></use></svg> Nómina y Licencias
        <span class="badge-count" id="badge-vacations" style="display:none;"></span>
      </button>

      <div class="nav-section-label">Desarrollo</div>
      <button class="nav-item" data-view="development"><svg class="icon"><use href="#icon-award"></use></svg> Capacitación y Desempeño</button>

      <div class="nav-section-label">Clima Laboral</div>
      <button class="nav-item" data-view="climate">
        <svg class="icon"><use href="#icon-smile"></use></svg> Clima y Conflictos
        <span class="badge-count" id="badge-conflicts" style="display:none;"></span>
      </button>

      <div class="nav-section-label">Sistema</div>
      <button class="nav-item" data-view="accounts"><svg class="icon"><use href="#icon-user-check"></use></svg> Cuentas de usuario</button>
      <button class="nav-item" id="nav-auditoria" data-view="auditoria" style="display:none;"><svg class="icon"><use href="#icon-eye"></use></svg> Auditoría</button>
      <button class="nav-item" data-view="settings"><svg class="icon"><use href="#icon-settings"></use></svg> Configuración</button>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__footer-user">
        <div class="avatar" id="session-avatar">AD</div>
        <div>
          <div class="user-name" id="session-name">Administrador</div>
          <div class="user-role" id="session-role">RRHH · Qubira</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button id="switch-module-btn" class="sidebar__logout-btn sidebar__switch-btn" title="Cambiar de módulo">
          <svg class="icon" style="width:15px;height:15px"><use href="#icon-grid"></use></svg>
          Módulos
        </button>
        <button id="logout-btn" class="sidebar__logout-btn" title="Cerrar sesión">
          <svg class="icon" style="width:15px;height:15px"><use href="#icon-log-out"></use></svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__left">
        <button class="menu-toggle" id="menu-toggle"><svg class="icon"><use href="#icon-menu"></use></svg></button>
        <div>
          <h1 id="topbar-title">Dashboard</h1>
          <div class="topbar__subtitle" id="topbar-subtitle">Resumen general de Recursos Humanos</div>
        </div>
      </div>
      <div class="topbar__right">
        <button class="icon-btn" title="Notificaciones">
          <svg class="icon"><use href="#icon-bell"></use></svg>
          <span class="dot"></span>
        </button>
        <div class="avatar">AD</div>
      </div>
    </header>

    <main class="content">
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-calendario"></section>
      <section class="view" id="view-employees"></section>
      <section class="view" id="view-contracts"></section>
      <section class="view" id="view-documents"></section>
      <section class="view" id="view-departments"></section>
      <section class="view" id="view-recruitment"></section>
      <section class="view" id="view-payroll"></section>
      <section class="view" id="view-development"></section>
      <section class="view" id="view-climate"></section>
      <section class="view" id="view-accounts"></section>
      <section class="view" id="view-auditoria"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay"></div>
<div id="toast-container"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
